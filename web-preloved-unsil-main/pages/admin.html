<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin — PRELOVEDU</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/pages.css"><link rel="stylesheet" href="../assets/css/refine.css"></head>
<body><div id="header-mount"></div>
<main class="app-container" style="padding-block:24px">
<h1 style="font-size:1.4rem;font-family:var(--font-serif);margin-bottom:16px">Dasbor Admin</h1>
<div class="stats" id="stats"></div>
<section class="panel"><h2>🔔 Notifikasi transaksi</h2><div id="notifs"></div></section>
<section class="panel"><h2>Akun mahasiswa</h2><div id="users"></div></section>
<section class="panel"><h2>Moderasi iklan</h2><div id="prods"></div></section>
</main><div id="bottom-nav-mount"></div>
<script type="module">
import {renderHeader,renderBottomNav,showToast} from '../assets/js/components/navbar.js';
import {getProducts,saveProducts,getOffers,getNotifs,saveNotifs} from '../assets/js/services/storage.js';
import {getUsers,saveUsers} from '../assets/js/services/auth.js';
document.getElementById('header-mount').innerHTML=renderHeader('admin','../');
document.getElementById('bottom-nav-mount').innerHTML=renderBottomNav('profil','../');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){
  const U=getUsers().filter(u=>u.role!=='admin'),P=getProducts(),O=getOffers();
  document.getElementById('stats').innerHTML=[[U.length,'Akun mahasiswa'],[P.filter(p=>p.status!=='terjual').length,'Iklan aktif'],[O.filter(o=>o.status==='diterima').length,'Tawaran diterima'],[P.filter(p=>p.status==='terjual').length,'Barang terjual']].map(([n,l])=>'<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>').join('');
  const N=getNotifs();
  document.getElementById('notifs').innerHTML=N.map(n=>'<div class="row-item" style="'+(n.read?'opacity:.5':'')+'"><div><b>'+(n.read?'':'● ')+'Transaksi selesai</b><small>'+esc(n.text)+'</small></div>'+(P.some(p=>p.id===n.productId)?'<button class="btn-sm2 danger" data-np="'+n.productId+'" data-n="'+n.id+'">Hapus dari katalog</button>':'<small>Sudah dihapus</small>')+'</div>').join('')||'<div class="row-item">Belum ada notifikasi.</div>';
  document.getElementById('users').innerHTML=U.map(u=>'<div class="row-item"><div><b>'+esc(u.name)+'</b><small>'+esc(u.email)+' · '+(u.verified?'Terverifikasi':'Belum verifikasi')+(u.suspended?' · Dinonaktifkan':'')+'</small>'+(u.ktmImage?'<br><a href="#" onclick="window.open(\''+u.ktmImage+'\')">Lihat KTM</a>':'')+'</div><div><button class="btn-sm2 '+(u.verified?'':'success')+'" data-v="'+u.id+'">'+(u.verified?'Verifikasi Ulang':'Verifikasi')+'</button><button class="btn-sm2'+(u.suspended?'':' danger')+'" data-u="'+u.id+'">'+(u.suspended?'Aktifkan':'Nonaktifkan')+'</button></div></div>').join('')||'<div class="row-item">Belum ada akun.</div>';
  document.getElementById('prods').innerHTML=P.map(p=>'<div class="row-item"><div><b>'+esc(p.title)+'</b><small>Rp '+Number(p.price||0).toLocaleString('id-ID')+' · '+esc(p.status)+'</small></div><button class="btn-sm2 danger" data-p="'+p.id+'">Hapus</button></div>').join('');
}
document.addEventListener('click',e=>{
  const np=e.target.closest('[data-np]');
  if(np){saveProducts(getProducts().filter(i=>i.id!==np.dataset.np));saveNotifs(getNotifs().map(n=>n.id===np.dataset.n?{...n,read:true}:n));showToast('Barang terjual dihapus dari katalog');draw();return;}
  const u=e.target.closest('[data-u]'),v=e.target.closest('[data-v]'),p=e.target.closest('[data-p]');
  if(u){const a=getUsers(),x=a.find(i=>i.id===u.dataset.u);x.suspended=!x.suspended;saveUsers(a);showToast(x.suspended?'Akun dinonaktifkan':'Akun diaktifkan');draw();}
  if(v){const a=getUsers(),x=a.find(i=>i.id===v.dataset.v);x.verified=!x.verified;saveUsers(a);showToast(x.verified?'Akun terverifikasi':'Verifikasi dibatalkan');draw();}
  if(p&&confirm('Hapus iklan ini?')){saveProducts(getProducts().filter(i=>i.id!==p.dataset.p));showToast('Iklan dihapus');draw();}
});
draw();setInterval(draw,1500);
</script></body></html>
